<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0918">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>냥밴드 · NYANG BAND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* Keep the game out of notches / home indicator; anything left over is letterbox. */
  #safe { position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #area { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 540px; height: 960px; transform-origin: 0 0; overflow: hidden;
    font-family: 'Jua', system-ui, sans-serif; color: #fff; background: #1a1530; }
  #game { position: absolute; left: 0; top: 0; width: 540px; height: 960px; display: block; touch-action: none; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
  .hidden { display: none !important; }
  .outline { -webkit-text-stroke: 7px #1d2452; paint-order: stroke fill; }

  #pauseBtn { position: absolute; right: 16px; top: 16px; width: 64px; height: 64px; border-radius: 20px;
    background: #fff4e0; border: 5px solid #1d2452; box-shadow: 0 5px 0 #1d2452; display: grid; place-items: center; }
  #pauseBtn i { display: inline-block; width: 9px; height: 26px; background: #1d2452; border-radius: 3px; margin: 0 3px; }
  #pauseBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1d2452; }

  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(18, 12, 38, .62); text-align: center; }
  .card { background: #fff4e0; color: #1d2452; border: 6px solid #1d2452; border-radius: 34px; box-shadow: 0 10px 0 #1d2452; }
  .btn { display: block; width: 330px; height: 84px; margin: 14px auto 0; border-radius: 28px; font-size: 36px;
    border: 6px solid #1d2452; box-shadow: 0 8px 0 #1d2452; background: #ffd23f; color: #1d2452; }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #1d2452; }
  .btn.pink { background: #ff6fae; } .btn.sky { background: #5cc8ff; } .btn.mint { background: #7fe0c4; }

  /* menu */
  #menu { justify-content: flex-start; padding-top: 70px; background: linear-gradient(rgba(18,12,38,.35), rgba(18,12,38,.8) 55%); }
  .title { font-size: 122px; line-height: 1; color: #ffd23f; letter-spacing: 4px; transform: rotate(-3deg); }
  .title span { color: #ff6fae; }
  .sub { font-size: 30px; color: #fff4e0; margin: 6px 0 18px; letter-spacing: 8px; }
  .guide { width: 480px; padding: 16px 16px 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .gitem { display: flex; align-items: center; gap: 10px; text-align: left; font-size: 21px; line-height: 1.15; }
  .gitem canvas { width: 66px; height: 66px; flex: none; }
  .gitem small { display: block; font-size: 15px; color: #6a5d86; }
  .diffs { display: flex; gap: 12px; margin-top: 22px; }
  .diff { width: 148px; height: 112px; border-radius: 26px; border: 6px solid #1d2452; box-shadow: 0 7px 0 #1d2452;
    background: #fff4e0; color: #1d2452; font-size: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .diff small { font-size: 16px; color: #6a5d86; margin-top: 4px; }
  .diff.on { background: #7fe0c4; transform: translateY(-6px); box-shadow: 0 13px 0 #1d2452; }
  .diff:active { transform: translateY(4px); box-shadow: 0 3px 0 #1d2452; }
  .keys { margin-top: 18px; font-size: 18px; color: #fff4e0; opacity: .85; }
  #startBtn { width: 380px; height: 96px; font-size: 44px; margin-top: 22px; background: #ff6fae; }

  /* pause */
  #pause .card { width: 400px; padding: 30px 0 38px; }
  #pause h2 { margin: 0 0 8px; font-size: 54px; font-weight: normal; }

  /* result */
  #result .card { width: 450px; padding: 22px 0 34px; }
  .rank { font-size: 170px; line-height: .95; }
  .newrec { display: inline-block; background: #ff6fae; color: #fff; border: 5px solid #1d2452; border-radius: 18px;
    padding: 4px 18px; font-size: 28px; transform: rotate(-4deg); margin-bottom: 4px; }
  .score { font-size: 64px; margin: 4px 0 10px; }
  .rows { width: 340px; margin: 0 auto; font-size: 25px; }
  .rows div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 3px dashed rgba(29,36,82,.18); }
  .p { color: #e0a21a; } .g { color: #2c8fd6; } .o { color: #2fae6e; } .m { color: #8a8399; }
</style>
</head>
<body>
<div id="safe"><div id="area">
  <div id="stage">
    <canvas id="game" aria-label="냥밴드 게임 화면"></canvas>

    <button id="pauseBtn" class="hidden" aria-label="일시정지"><span><i></i><i></i></span></button>

    <section id="menu" class="panel">
      <div class="title outline">냥<span>밴드</span></div>
      <div class="sub outline">NYANG BAND</div>
      <div class="guide card">
        <div class="gitem"><canvas data-icon="snare" width="132" height="132"></canvas><div>하늘 노트<small>스네어에 닿을 때 탭</small></div></div>
        <div class="gitem"><canvas data-icon="kick" width="132" height="132"></canvas><div>분홍 노트<small>베이스드럼에 닿을 때 탭</small></div></div>
        <div class="gitem"><canvas data-icon="hold" width="132" height="132"></canvas><div>노란 홀드<small>심벌을 끝까지 누르기</small></div></div>
        <div class="gitem"><canvas data-icon="swipe" width="132" height="132"></canvas><div>SWIPE<small>원이 끝에 닿을 때 쓸기</small></div></div>
      </div>
      <div class="diffs">
        <button class="diff" data-diff="easy">쉬움<small>BEST 0</small></button>
        <button class="diff on" data-diff="normal">보통<small>BEST 0</small></button>
        <button class="diff" data-diff="hard">어려움<small>BEST 0</small></button>
      </div>
      <button id="startBtn" class="btn">공연 시작!</button>
      <div class="keys">D 스네어 · K 베이스 · Space 홀드 · L 스와이프 · Esc 일시정지</div>
    </section>

    <section id="pause" class="panel hidden">
      <div class="card">
        <h2>일시정지</h2>
        <button class="btn mint" data-act="resume">계속하기</button>
        <button class="btn sky" data-act="restart">처음부터</button>
        <button class="btn pink" data-act="menu">메뉴로</button>
      </div>
    </section>

    <section id="result" class="panel hidden">
      <div class="card">
        <div id="rRank" class="rank outline">S</div>
        <div id="rNew" class="newrec hidden">최고기록 갱신!</div>
        <div id="rScore" class="score">0</div>
        <div class="rows">
          <div><span class="p">PERFECT</span><b id="rP">0</b></div>
          <div><span class="g">GREAT</span><b id="rG">0</b></div>
          <div><span class="o">GOOD</span><b id="rO">0</b></div>
          <div><span class="m">MISS</span><b id="rM">0</b></div>
          <div><span>최대 콤보</span><b id="rC">0</b></div>
          <div><span>정확도</span><b id="rA">0%</b></div>
        </div>
        <button class="btn" data-act="retry">다시하기</button>
        <button class="btn sky" data-act="menu">메뉴로</button>
      </div>
    </section>
  </div>
</div></div>

<script>
'use strict';
/* ==========================================================================
   냥밴드 · NYANG BAND — single file, Canvas 2D + Web Audio only.
   ========================================================================== */
const W = 540, H = 960;
const OUT = '#1d2452';
const BPM = 116, BEAT = 60 / BPM, S16 = BEAT / 4, BAR = BEAT * 4, BARS = 40, SONG_LEN = BARS * BAR;
const SPAWN_Y = 112;
const WIN = { PERFECT: 0.055, GREAT: 0.100, GOOD: 0.160 };
const BASE = { PERFECT: 300, GREAT: 200, GOOD: 100 };
const DIFFS = {
  easy:   { name: '쉬움',   fall: 1.55, seed: 11 },
  normal: { name: '보통',   fall: 1.25, seed: 22 },
  hard:   { name: '어려움', fall: 1.00, seed: 33 }
};
const LANES = [
  { name: 'snare', x: 145, y: 793, color: '#5cc8ff', dark: '#2c8fd6' },
  { name: 'crash', x: 270, y: 686, color: '#ffd23f', dark: '#e0a21a' },
  { name: 'kick',  x: 395, y: 815, color: '#ff6fae', dark: '#e0437f' }
];
const SWIPE_Y = 470;
const STORE_KEY = 'nyangband.best.v1';

/* ---------------- canvas & letterbox scaling ---------------- */
const area = document.getElementById('area');
const stage = document.getElementById('stage');
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1, pxRatio = 1, bgCache = null;

function layout() {
  const w = area.clientWidth, h = area.clientHeight;
  scale = Math.min(w / W, h / H);
  const left = (w - W * scale) / 2, top = (h - H * scale) / 2;
  stage.style.transform = `translate(${left}px,${top}px) scale(${scale})`;
  pxRatio = Math.min(3, (window.devicePixelRatio || 1) * scale);
  cv.width = Math.round(W * pxRatio); cv.height = Math.round(H * pxRatio);
  bgCache = buildBackground(pxRatio);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------------- drawing helpers ---------------- */
const TAU = Math.PI * 2;
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
function paint(c, fill, lw) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw !== 0) { c.lineWidth = lw || 5; c.strokeStyle = OUT; c.lineJoin = 'round'; c.stroke(); }
}
// thick cartoon limb: navy outline under a colored stroke
function limb(c, pts, color, w) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 3) c.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
  else for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = OUT; c.lineWidth = w + 10; c.stroke();
  c.strokeStyle = color; c.lineWidth = w; c.stroke();
}
function starPath(c, x, y, r, rot, points) {
  points = points || 5;
  c.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = rot + i * Math.PI / points - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.closePath();
}
function text(c, s, x, y, size, fill, opts) {
  opts = opts || {};
  c.font = `${size}px Jua, system-ui, sans-serif`;
  c.textAlign = opts.align || 'center'; c.textBaseline = opts.base || 'middle';
  c.lineJoin = 'round';
  c.lineWidth = opts.lw === undefined ? Math.max(4, size * 0.16) : opts.lw;
  if (c.lineWidth) { c.strokeStyle = opts.stroke || OUT; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function gray(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const v = Math.round(r * .3 + g * .59 + b * .11);
  return `rgb(${v},${v},${v})`;
}

/* ---------------- static background (cached) ---------------- */
function buildBackground(k) {
  const b = document.createElement('canvas');
  b.width = Math.round(W * k); b.height = Math.round(H * k);
  const c = b.getContext('2d');
  c.setTransform(k, 0, 0, k, 0, 0);

  // wine stage wall
  let g = c.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#5a1530'); g.addColorStop(1, '#7a2444');
  c.fillStyle = g; c.fillRect(0, 0, W, 600);
  c.fillStyle = 'rgba(0,0,0,.13)';
  for (let x = 27; x < W; x += 54) c.fillRect(x, 0, 6, 600);
  c.fillStyle = 'rgba(255,200,220,.06)';
  for (let x = 0; x < W; x += 54) c.fillRect(x, 0, 3, 600);
  // scalloped curtain valance
  c.fillStyle = '#3d0d22';
  c.fillRect(0, 0, W, 28);
  for (let x = 0; x < W + 40; x += 45) { ell(c, x, 28, 24, 16); c.fill(); }
  c.fillStyle = 'rgba(255,215,90,.18)';
  for (let i = 0; i < 14; i++) { starPath(c, 30 + i * 39, 150 + (i % 3) * 60 + (i % 2) * 25, 5, 0); c.fill(); }

  // light rigs (trusses + cans)
  [[-1, 0], [1, W]].forEach(([dir, ox]) => {
    c.save(); c.translate(ox, 0); c.scale(-dir, 1);
    rrect(c, -10, 40, 215, 22, 6); paint(c, '#8b93ad', 4);
    c.strokeStyle = OUT; c.lineWidth = 2.5;
    c.beginPath(); for (let x = 0; x < 200; x += 18) { c.moveTo(x, 43); c.lineTo(x + 9, 59); c.lineTo(x + 18, 43); } c.stroke();
    [42, 102, 162].forEach((x, i) => {
      c.save(); c.translate(x, 62); c.rotate(-0.45 - i * 0.12);
      rrect(c, -4, 0, 8, 12, 2); paint(c, '#2d3561', 3);
      rrect(c, -17, 10, 34, 42, 9); paint(c, '#2d3561', 4);
      ell(c, 0, 52, 15, 6); paint(c, ['#ff6fae', '#ffd23f', '#5cc8ff'][i], 3);
      c.restore();
    });
    c.restore();
  });

  // keyboard on X-stand (left)
  limb(c, [[22, 600], [128, 478]], '#3a3f5c', 7);
  limb(c, [[128, 600], [22, 478]], '#3a3f5c', 7);
  c.save(); c.translate(8, 452); c.rotate(-0.04);
  rrect(c, 0, 0, 158, 34, 8); paint(c, '#2b2f45', 5);
  rrect(c, 8, 5, 142, 14, 3); paint(c, '#fff', 3);
  c.strokeStyle = OUT; c.lineWidth = 1.6;
  c.beginPath(); for (let x = 18; x < 150; x += 10) { c.moveTo(8 + x - 8, 5); c.lineTo(8 + x - 8, 19); } c.stroke();
  c.fillStyle = OUT; for (let x = 20; x < 148; x += 10) if ([1, 2, 4, 5, 6].includes(Math.round((x - 20) / 10) % 7)) c.fillRect(8 + x - 5, 5, 5, 8);
  c.fillStyle = '#ff6fae'; ell(c, 140, 27, 4, 4); c.fill();
  c.restore();

  // road case (right)
  rrect(c, 418, 470, 116, 130, 10); paint(c, '#3a3f5c', 5);
  c.fillStyle = '#4b5276'; c.fillRect(424, 476, 104, 52);
  c.strokeStyle = '#b9c2d6'; c.lineWidth = 6; c.beginPath(); c.moveTo(421, 534); c.lineTo(531, 534); c.stroke();
  [[418, 470], [512, 470], [418, 578], [512, 578]].forEach(([x, y]) => { rrect(c, x, y, 22, 22, 5); paint(c, '#b9c2d6', 3); });
  rrect(c, 452, 552, 48, 12, 6); paint(c, '#1d2452', 0);
  c.save(); c.translate(476, 500); c.rotate(-0.15); rrect(c, -40, -16, 80, 32, 10); paint(c, '#ffd23f', 3);
  text(c, 'NYANG', 0, 1, 19, OUT, { lw: 0 }); c.restore();

  // stage floor (wood)
  g = c.createLinearGradient(0, 590, 0, 662);
  g.addColorStop(0, '#c98a55'); g.addColorStop(1, '#a8693d');
  c.fillStyle = g; c.fillRect(0, 590, W, 72);
  c.strokeStyle = 'rgba(29,36,82,.35)'; c.lineWidth = 2;
  for (let y = 604; y < 662; y += 18) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  for (let i = 0; i < 16; i++) { const y = 590 + (i % 4) * 18, x = (i * 97) % W; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 18); c.stroke(); }
  c.strokeStyle = OUT; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 590); c.lineTo(W, 590); c.stroke();
  // stage lip
  c.fillStyle = '#6b3f26'; c.fillRect(0, 662, W, 20);
  c.beginPath(); c.moveTo(0, 662); c.lineTo(W, 662); c.moveTo(0, 682); c.lineTo(W, 682); c.stroke();
  // front floor
  g = c.createLinearGradient(0, 682, 0, H);
  g.addColorStop(0, '#2e2550'); g.addColorStop(1, '#16112b');
  c.fillStyle = g; c.fillRect(0, 682, W, H - 682);
  c.fillStyle = 'rgba(255,255,255,.04)';
  for (let x = -40; x < W; x += 60) { c.beginPath(); c.moveTo(x, 682); c.lineTo(x + 30, 682); c.lineTo(x - 30, H); c.lineTo(x - 60, H); c.fill(); }
  return b;
}

/* ---------------- characters ---------------- */
function drawCat(c, x, footY, a) {
  // a = { bounce 0..1, wave -1..1, mouth 0..1, gray bool, t }
  const C = a.gray ? gray : (h) => h;
  const ORANGE = C('#f7a03c'), CREAM = C('#ffe1b0'), MINT = C('#7fe0c4'), MINT_D = C('#4fbfa3');
  c.save();
  c.translate(x, footY - a.bounce * 12);
  const squash = 1 - a.squash * 0.05;
  c.scale(1 + a.squash * 0.03, squash);
  // tail
  limb(c, [[40, -70], [95, -95 + Math.sin(a.t * 3) * 12], [80, -150]], ORANGE, 14);
  // legs + shoes
  rrect(c, -36, -62, 28, 58, 10); paint(c, C('#2d3561'));
  rrect(c, 8, -62, 28, 58, 10); paint(c, C('#2d3561'));
  ell(c, -26, -4, 22, 10); paint(c, C('#ffffff'), 4);
  ell(c, 26, -4, 22, 10); paint(c, C('#ffffff'), 4);
  // waving arm (behind body on the right)
  const wv = a.wave;
  limb(c, [[44, -140], [92 + wv * 6, -150 - wv * 18], [78 + wv * 16, -200 - wv * 26]], MINT, 22);
  ell(c, 78 + wv * 16, -204 - wv * 26, 13, 13); paint(c, ORANGE, 4);
  // jacket torso
  c.beginPath();
  c.moveTo(-50, -150); c.quadraticCurveTo(-60, -95, -48, -56); c.lineTo(48, -56); c.quadraticCurveTo(60, -95, 50, -150);
  c.quadraticCurveTo(0, -166, -50, -150); c.closePath(); paint(c, MINT);
  c.beginPath(); c.moveTo(-20, -158); c.lineTo(0, -100); c.lineTo(20, -158); c.closePath(); paint(c, CREAM, 4);
  c.beginPath(); c.moveTo(-20, -158); c.lineTo(-6, -118); c.lineTo(-34, -96); c.lineTo(-44, -148); c.closePath(); paint(c, MINT_D, 4);
  c.beginPath(); c.moveTo(20, -158); c.lineTo(6, -118); c.lineTo(34, -96); c.lineTo(44, -148); c.closePath(); paint(c, MINT_D, 4);
  ell(c, 0, -84, 5, 5); paint(c, C('#ffd23f'), 3);
  ell(c, 0, -68, 5, 5); paint(c, C('#ffd23f'), 3);
  // mic arm (front, left side) + mic
  limb(c, [[-46, -138], [-86, -110], [-52, -178]], MINT, 22);
  c.save(); c.translate(-46, -184); c.rotate(-0.55);
  rrect(c, -6, -2, 12, 40, 5); paint(c, C('#3a3f5c'), 4);
  ell(c, 0, -10, 13, 15); paint(c, C('#c7cfdd'), 4);
  c.strokeStyle = C('#8b93ad'); c.lineWidth = 2;
  c.beginPath(); c.moveTo(-9, -12); c.lineTo(9, -12); c.moveTo(-8, -5); c.lineTo(8, -5); c.stroke();
  c.restore();
  ell(c, -50, -178, 13, 13); paint(c, ORANGE, 4);
  // head
  c.save(); c.translate(0, -215); c.rotate(Math.sin(a.t * Math.PI * BPM / 60 / 2) * 0.06);
  c.beginPath(); c.moveTo(-50, -26); c.lineTo(-44, -70); c.lineTo(-14, -48); c.closePath(); paint(c, ORANGE);
  c.beginPath(); c.moveTo(50, -26); c.lineTo(44, -70); c.lineTo(14, -48); c.closePath(); paint(c, ORANGE);
  c.beginPath(); c.moveTo(-40, -36); c.lineTo(-40, -58); c.lineTo(-22, -46); c.closePath(); c.fillStyle = C('#ffb3c7'); c.fill();
  c.beginPath(); c.moveTo(40, -36); c.lineTo(40, -58); c.lineTo(22, -46); c.closePath(); c.fill();
  ell(c, 0, 0, 62, 54); paint(c, ORANGE);
  c.fillStyle = C('#e2832a');
  [[-8, -50, 6, 14], [8, -50, 6, 14], [-56, -2, 10, 4], [56, -2, 10, 4]].forEach(([sx, sy, w, h]) => { ell(c, sx, sy, w, h); c.fill(); });
  ell(c, 0, 22, 34, 22); paint(c, CREAM, 4);
  // mouth
  const m = a.mouth;
  if (m > 0.08) {
    ell(c, 0, 26 + m * 4, 11 + m * 4, 5 + m * 13); paint(c, C('#8a1f3d'), 4);

const Audio = {
  ctx: null, master: null, music: null, sfx: null, noise: null,

    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.62; this.music.connect(this.master);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.95; this.sfx.connect(this.master);
    const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);

  s.connect(f); f.connect(g); g.connect(dest);

/* ---- song data: 116 BPM funk, 40 bars ---- */
function sectionOf(bar) {
  if (bar < 2) return 'intro';
  if (bar < 10) return 'verse';
  if (bar < 18) return 'chorus';
  if (bar < 22) return 'break';
  if (bar < 30) return 'verse';
  if (bar < 38) return 'chorus';
  return 'outro';
}
function chorusBar(bar) { return bar - (bar < 18 ? 10 : 30); }
const CHORDS = {
  Dm7: { root: 38, clav: [65, 69, 72, 74], brass: [69, 72, 77], pad: [62, 65, 69, 72] },
  G7:  { root: 43, clav: [65, 67, 71, 74], brass: [67, 71, 77], pad: [59, 62, 65, 67] },
  Gm7: { root: 43, clav: [62, 65, 67, 70], brass: [70, 74, 77], pad: [58, 62, 65, 67] },
  C7:  { root: 36, clav: [64, 67, 70, 72], brass: [70, 76, 79], pad: [58, 60, 64, 67] },
  A7:  { root: 33, clav: [64, 67, 69, 73], brass: [67, 73, 76], pad: [57, 61, 64, 67] },
  Bb:  { root: 34, clav: [62, 65, 70, 74], brass: [70, 74, 77], pad: [58, 62, 65, 70] }
};
function chordOf(bar) {
  const s = sectionOf(bar);
  if (s === 'chorus') return ['Gm7', 'C7', 'Dm7', 'A7'][chorusBar(bar) % 4];
  if (s === 'break') return ['Bb', 'A7'][(bar - 18) % 2];
  if (s === 'outro') return bar === 38 ? 'A7' : 'Dm7';
  return bar % 2 === 0 ? 'Dm7' : 'G7';
}

const LEAD = [[0, 74, 2], [2, 77, 2], [4, 79, 3], [8, 77, 1], [9, 79, 1], [10, 82, 2], [12, 81, 2], [14, 79, 2],
  [16, 76, 2], [18, 79, 2], [20, 82, 4], [26, 81, 2], [28, 79, 4],
  [32, 81, 3], [35, 77, 1], [36, 74, 2], [38, 77, 2], [40, 81, 2], [42, 84, 2], [44, 81, 4],
  [48, 79, 2], [50, 76, 2], [52, 73, 4], [56, 76, 2], [58, 79, 2]];

function scheduleStep(bus, i, t, vis) {
  const bar = Math.floor(i / 16), st = i % 16, sec = sectionOf(bar), ch = CHORDS[chordOf(bar)];

  if (st % 4 === 0) vis.push({ t, kind: 'beat' });
  const final = bar === 39;

  if (sec === 'break') { if (st % 4 === 0) Synth.hat(bus, t, 0.8, st === 8); }
  else if (!final) { Synth.hat(bus, t, st % 4 === 0 ? 1 : st % 2 === 0 ? 0.7 : 0.4, sec === 'chorus' && st === 14); if (st % 2 === 0) vis.push({ t, kind: 'hat' }); }

  if ((st === 0 || (st === 8 && sec !== 'break' && !final))) Synth.kick(bus, t, final ? 0.5 : 0.32);

  if (sec === 'break' || final) {

  } else if (!(bar === 0)) {
    BASS_PAT.forEach(([s, iv, v, len]) => { if (s === st) Synth.bass(bus, t, ch.root + iv, len * S16, v); });
  }

  if ((sec === 'verse' || (bar === 1)) && CLAV_STEPS.includes(st)) { Synth.clav(bus, t, ch.clav, st === 10 ? 1 : 0.8); vis.push({ t, kind: 'clav' }); }
  // chorus brass stabs + lead
  if (sec === 'chorus' || bar === 38) {
    if (BRASS_STEPS[st] !== undefined) { Synth.brass(bus, t, ch.brass, S16 * 0.9, BRASS_STEPS[st]); vis.push({ t, kind: 'brass' }); }
    const ps = (sec === 'chorus' ? chorusBar(bar) % 4 : 3) * 16 + st;
    LEAD.forEach(([s, m, len]) => { if (s === ps) { Synth.lead(bus, t, m, len * S16 * 0.95); vis.push({ t, kind: 'lead', dur: len * S16 }); } });
  }
  // break: brass pads under the holds
  if (sec === 'break' && st === 0) { Synth.pad(bus, t, ch.pad, BAR * 0.95); Synth.brass(bus, t, ch.brass, BAR * 0.55, 0.5); vis.push({ t, kind: 'brass', long: true }); }
  if (final && st === 0) { Synth.pad(bus, t, [62, 65, 69, 72, 76], BAR * 1.3); Synth.brass(bus, t, [69, 74, 77], BEAT * 2, 1); vis.push({ t, kind: 'brass', long: true }); }

/* ---------------- chart generation ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PATTERNS = {
  verse: {
    easy: [[[0, 'K'], [4, 'S'], [8, 'K'], [12, 'S']], [[0, 'K'], [4, 'S'], [10, 'K'], [12, 'S']], [[0, 'K'], [8, 'S'], [12, 'S']]],
    normal: [[[0, 'K'], [4, 'S'], [7, 'K'], [10, 'K'], [12, 'S']], [[0, 'K'], [4, 'S'], [8, 'K'], [10, 'K'], [12, 'S']], [[0, 'K'], [3, 'K'], [4, 'S'], [8, 'K'], [12, 'S'], [14, 'S']]],
    hard: [[[0, 'KS'], [2, 'K'], [4, 'S'], [7, 'K'], [10, 'K'], [12, 'S'], [15, 'S']], [[0, 'K'], [3, 'K'], [4, 'S'], [6, 'K'], [7, 'S'], [10, 'K'], [12, 'S'], [13, 'K']],
      [[0, 'K'], [2, 'S'], [4, 'S'], [6, 'K'], [8, 'K'], [10, 'K'], [12, 'S'], [14, 'S'], [15, 'K']]]
  },
  chorus: {
    easy: [[[4, 'S'], [8, 'K'], [12, 'S']], [[0, 'K'], [4, 'S'], [8, 'K'], [12, 'S']]],
    normal: [[[0, 'K'], [4, 'S'], [6, 'K'], [8, 'K'], [12, 'S'], [14, 'K']], [[0, 'K'], [4, 'S'], [7, 'K'], [10, 'K'], [12, 'S'], [13, 'S']]],
    hard: [[[0, 'K'], [3, 'K'], [4, 'S'], [6, 'K'], [8, 'K'], [10, 'S'], [12, 'S'], [14, 'K'], [15, 'S']],
      [[0, 'KS'], [2, 'K'], [4, 'S'], [6, 'S'], [7, 'K'], [10, 'K'], [12, 'S'], [13, 'K'], [14, 'S']]]
  },
  outro: {
    easy: [[0, 'K'], [4, 'S'], [8, 'K'], [12, 'S']],
    normal: [[0, 'K'], [4, 'S'], [8, 'K'], [10, 'S'], [12, 'S'], [14, 'S']],
    hard: [[0, 'KS'], [4, 'S'], [6, 'K'], [8, 'S'], [9, 'S'], [10, 'S'], [11, 'S'], [12, 'KS'], [14, 'S'], [15, 'S']]
  }
};
const HOLD_LEN = { chorus: { easy: 8, normal: 8, hard: 6 }, break: { easy: 8, normal: 10, hard: 12 } };

function buildChart(dk) {
  const rnd = mulberry32(DIFFS[dk].seed);
  const notes = [];
  const T = (bar, st) => (bar * 16 + st) * S16;
  const add = (bar, st, k) => {
    if (k.includes('K')) notes.push({ type: 'tap', lane: 2, t: T(bar, st) });
    if (k.includes('S')) notes.push({ type: 'tap', lane: 0, t: T(bar, st) });
  };
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  for (let bar = 2; bar < BARS; bar++) {
    const sec = sectionOf(bar);
    if (sec === 'verse') pick(PATTERNS.verse[dk]).forEach(([st, k]) => add(bar, st, k));
    else if (sec === 'chorus') {
      const lb = chorusBar(bar) % 4;
      if (lb === 0) notes.push({ type: 'hold', lane: 1, t: T(bar, 0), end: T(bar, HOLD_LEN.chorus[dk]) });
      pick(PATTERNS.chorus[dk]).forEach(([st, k]) => {
        if (lb === 3 && st >= 10) return;                 // leave room for the swipe
        if (lb === 0 && st === 0 && dk !== 'hard') return; // hold head stands alone
        add(bar, st, k);
      });
      if (lb === 3) notes.push({ type: 'swipe', lane: -1, t: T(bar, 12) });
    } else if (sec === 'break') {
      notes.push({ type: 'hold', lane: 1, t: T(bar, 0), end: T(bar, HOLD_LEN.break[dk]) });
      if (dk === 'normal') add(bar, 12, 'K');
      if (dk === 'hard') { add(bar, 12, 'K'); add(bar, 14, 'S'); }
    } else if (sec === 'outro') {
      if (bar === 38) PATTERNS.outro[dk].forEach(([st, k]) => add(bar, st, k));
      else notes.push({ type: 'hold', lane: 1, t: T(bar, 0), end: T(bar, 8) });
    }
  }
  notes.sort((a, b) => a.t - b.t || a.lane - b.lane);
  let out = notes;
  if (dk === 'easy') { // easy: never two notes at once (including while holding)
    const holds = notes.filter((n) => n.type !== 'tap');
    out = [];
    notes.forEach((n) => {
      if (n.type === 'tap') {
        if (holds.some((h) => n.t > h.t - S16 * 1.5 && n.t < (h.end || h.t) + S16 * 1.5)) return;
        if (out.length && Math.abs(out[out.length - 1].t - n.t) < 0.01) return;
      }
      out.push(n);
    });
  }
  out.forEach((n, i) => { n.id = i; n.done = false; n.grade = null; n.holding = false; n.headDone = false; });
  return out;
}

/* ---------------- game state ---------------- */
const G = {
  state: 'menu', diff: 'normal', notes: [], score: 0, combo: 0, maxCombo: 0,
  counts: { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 }, total: 0,
  startAt: 0, vis: { t: -1, perf: 0 }, bus: null, timer: null, nextStep: 0, nextStepTime: 0, vEvents: [],
  fx: { shake: [0, 0, 0], hat: 0, stuckRoses: [] }, particles: [], popups: [], roses: [],
  missTimer: 0, leadUntil: 0, puff: 0, comboPop: 0, ended: false, pointers: new Map(), keyHold: null,
  best: { easy: 0, normal: 0, hard: 0 }, autoplay: /[?&]autoplay\b/.test(location.search)
};

function loadBest() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); Object.keys(G.best).forEach((k) => { if (typeof v[k] === 'number' && isFinite(v[k])) G.best[k] = v[k]; }); } catch (e) { /* storage blocked */ }
}
function saveBest() { try { localStorage.setItem(STORE_KEY, JSON.stringify(G.best)); } catch (e) { /* storage blocked */ } }

function songNow() {
  if (G.state !== 'play') return G.vis.t;
  return G.vis.t + (performance.now() - G.vis.perf) / 1000;
}
function rawSongTime() { return Audio.ctx.currentTime - Audio.latency() - G.startAt; }
// smooth the audio clock (it moves in render quanta) so falling notes glide evenly
function syncClock() {
  const raw = rawSongTime(), pred = songNow();
  const t = Math.abs(raw - pred) > 0.045 ? raw : pred + (raw - pred) * 0.08;
  G.vis.t = t; G.vis.perf = performance.now();
}

function startGame() {
  Audio.init();
  Audio.ctx.resume();
  stopMusic();
  G.notes = buildChart(G.diff);
  G.total = G.notes.reduce((s, n) => s + (n.type === 'hold' ? 2 : 1), 0);
  G.score = 0; G.combo = 0; G.maxCombo = 0; G.counts = { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 };
  G.fx = { shake: [0, 0, 0], hat: 0, stuckRoses: [] }; G.particles = []; G.popups = []; G.roses = [];
  G.missTimer = 0; G.leadUntil = 0; G.puff = 0; G.ended = false; G.pointers.clear(); G.keyHold = null; G.vEvents = [];
  G.bus = Audio.ctx.createGain(); G.bus.connect(Audio.music);
  G.startAt = Audio.ctx.currentTime + 0.9;
  G.nextStep = 0; G.nextStepTime = G.startAt;
  G.vis = { t: rawSongTime(), perf: performance.now() };
  G.state = 'play';
  G.timer = setInterval(scheduler, 25);
  scheduler();
  show(null);
  document.getElementById('pauseBtn').classList.remove('hidden');
}
function scheduler() {
  const a = Audio.ctx;
  if (!a || a.state !== 'running') return;
  while (G.nextStep < BARS * 16 && G.nextStepTime < a.currentTime + 0.12) {
    scheduleStep(G.bus, G.nextStep, G.nextStepTime, G.vEvents);
    G.nextStep++; G.nextStepTime = G.startAt + G.nextStep * S16;
  }
}
function stopMusic() {
  clearInterval(G.timer); G.timer = null;
  if (G.bus) {
    const b = G.bus; G.bus = null;
    try { b.gain.setTargetAtTime(0, Audio.ctx.currentTime, 0.04); } catch (e) { /* ignore */ }
    setTimeout(() => b.disconnect(), 500);
  }
}
function pauseGame() {
  if (G.state !== 'play') return;
  G.vis.t = songNow();
  G.state = 'paused';
  Audio.ctx.suspend();
  releaseAll();
  show('pause');
}
function resumeGame() {
  if (G.state !== 'paused') return;
  show(null);
  Audio.ctx.resume().then(() => { G.vis = { t: rawSongTime(), perf: performance.now() }; G.state = 'play'; });
}
function toMenu() {
  stopMusic();
  if (Audio.ctx) Audio.ctx.resume();
  G.state = 'menu';
  document.getElementById('pauseBtn').classList.add('hidden');
  refreshMenu();
  show('menu');
}
function finish() {
  G.state = 'result'; G.ended = true;
  clearInterval(G.timer); G.timer = null;
  document.getElementById('pauseBtn').classList.add('hidden');
  const c = G.counts, total = Math.max(1, G.total);
  const acc = (c.PERFECT + c.GREAT * 0.7 + c.GOOD * 0.4) / total;
  const rank = acc >= 0.95 ? 'S' : acc >= 0.88 ? 'A' : acc >= 0.75 ? 'B' : acc >= 0.6 ? 'C' : 'D';
  const score = Math.round(G.score);
  const isNew = score > G.best[G.diff];
  if (isNew) { G.best[G.diff] = score; saveBest(); }
  const $ = (id) => document.getElementById(id);
  $('rRank').textContent = rank;
  $('rRank').style.color = { S: '#ffd23f', A: '#ff6fae', B: '#5cc8ff', C: '#7fe0c4', D: '#b9b2c9' }[rank];
  $('rNew').classList.toggle('hidden', !isNew);
  $('rScore').textContent = score.toLocaleString();
  $('rP').textContent = c.PERFECT; $('rG').textContent = c.GREAT; $('rO').textContent = c.GOOD; $('rM').textContent = c.MISS;
  $('rC').textContent = G.maxCombo; $('rA').textContent = (acc * 100).toFixed(1) + '%';
  show('result');
}

/* ---------------- judging ---------------- */
function gradeOf(dt) { dt = Math.abs(dt); return dt <= WIN.PERFECT ? 'PERFECT' : dt <= WIN.GREAT ? 'GREAT' : dt <= WIN.GOOD ? 'GOOD' : 'MISS'; }
const multiplier = () => 1 + Math.min(10, Math.floor(G.combo / 10)) * 0.1;
function judge(grade, x, y, lane) {
  G.counts[grade]++;
  if (grade === 'MISS') {
    G.combo = 0; G.missTimer = 0.75;
    popup('MISS', x, y, '#b9b2c9');
    return;
  }
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.comboPop = 1;
  G.score += BASE[grade] * multiplier();
  popup(grade, x, y, { PERFECT: '#ffd23f', GREAT: '#5cc8ff', GOOD: '#7fe0c4' }[grade]);
  burst(x, y, lane >= 0 ? LANES[lane].color : '#5ee08a', grade === 'PERFECT' ? 16 : 11);
  if (G.combo % 30 === 0) throwRose();
}
function hitLane(lane, src) {
  const t = songNow(), L = LANES[lane];
  if (Audio.ctx) { const now = Audio.ctx.currentTime; lane === 0 ? Synth.snare(Audio.sfx, now) : lane === 2 ? Synth.bigKick(Audio.sfx, now) : Synth.crash(Audio.sfx, now); }
  G.fx.shake[lane] = 1;
  if (G.state !== 'play') return null;
  let best = null, bd = 1e9;
  for (const n of G.notes) {
    if (n.done || n.headDone || n.lane !== lane) continue;
    const d = Math.abs(n.t - t);
    if (n.t - t > WIN.GOOD) break;
    if (d <= WIN.GOOD && d < bd) { best = n; bd = d; }
  }
  if (!best) return null;
  const grade = gradeOf(best.t - t);
  if (best.type === 'hold') {
    best.headDone = true; best.holding = true; best.holder = src; best.headGrade = grade;
    judge(grade, L.x, L.y - 40, lane);
  } else {
    best.done = true; best.grade = grade;
    judge(grade, L.x, L.y - 40, lane);
  }
  return best;
}
function pendingSwipe(t) {
  return G.notes.find((n) => n.type === 'swipe' && !n.done && Math.abs(n.t - t) <= WIN.GOOD) || null;
}
function doSwipe() {
  if (Audio.ctx) {
    const now = Audio.ctx.currentTime;
    Synth.whoosh(Audio.sfx, now);
    const bar = Math.max(0, Math.floor(songNow() / BAR));
    Synth.brass(Audio.sfx, now, CHORDS[chordOf(Math.min(BARS - 1, bar))].brass.map((m) => m + 0), 0.22, 1.2);
    G.puff = 1;
  }
  if (G.state !== 'play') return;
  const n = pendingSwipe(songNow());
  if (!n) return;
  n.done = true; n.grade = gradeOf(n.t - songNow()); n.hitAt = songNow();
  const [ex, ey] = swipeCurve(1);
  judge(n.grade, 270, SWIPE_Y - 70, -1);
  burst(ex, ey, '#5ee08a', 18);
}
function releaseHold(src) {
  for (const n of G.notes) {
    if (n.type === 'hold' && n.holding && n.holder === src) {
      n.holding = false;
      const t = songNow();
      if (t >= n.end - 0.12) completeHold(n);
      else { n.done = true; judge('MISS', LANES[1].x, LANES[1].y - 40, 1); }
    }
  }
}
function completeHold(n) {
  n.done = true; n.holding = false;
  judge('PERFECT', LANES[1].x, LANES[1].y - 40, 1);
  burst(LANES[1].x, LANES[1].y, '#ffd23f', 22);
}
function releaseAll() {
  G.pointers.forEach((p, id) => releaseHold('p' + id));
  G.pointers.clear();
  if (G.keyHold) { releaseHold('key'); G.keyHold = null; }
}

function updateJudging() {
  const t = songNow();
  for (const n of G.notes) {
    if (n.t - t > 2) break;
    if (n.done) continue;
    if (n.type === 'hold') {
      // a hold counts as two judgements (head + tail); missing the head misses both
      if (!n.headDone && t - n.t > WIN.GOOD) { n.done = true; judge('MISS', LANES[1].x, LANES[1].y - 40, 1); G.counts.MISS++; continue; }
      if (n.holding) {
        if (t >= n.end) completeHold(n);
        else if (Math.random() < 0.6) sparkle();
      }
    } else if (t - n.t > WIN.GOOD) {
      n.done = true; n.grade = 'MISS';
      if (n.type === 'swipe') judge('MISS', 270, SWIPE_Y - 70, -1);
      else judge('MISS', LANES[n.lane].x, LANES[n.lane].y - 40, n.lane);
    }
  }
}
function autoplay() {
  const t = songNow();
  for (const n of G.notes) {
    if (n.t > t) break;
    if (n.done) continue;
    if (n.type === 'tap') hitLane(n.lane, 'auto');
    else if (n.type === 'swipe') doSwipe();
    else if (n.type === 'hold' && !n.headDone) hitLane(1, 'auto');
  }
  G.notes.forEach((n) => { if (n.type === 'hold' && n.holding && t >= n.end) releaseHold('auto'); });
}

/* ---------------- effects ---------------- */
function popup(textStr, x, y, color) {
  G.popups.push({ text: textStr, x, y, color, t: 0 });
  if (G.popups.length > 12) G.popups.shift();
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = 160 + Math.random() * 300;
    G.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: 0.55 + Math.random() * 0.3, t: 0, r: 7 + Math.random() * 8, rot: Math.random() * 6, color, star: true });
  }
  G.particles.push({ x, y, ring: true, t: 0, life: 0.35, color });
  if (G.particles.length > 320) G.particles.splice(0, G.particles.length - 320);
}
function sparkle() {
  const a = Math.random() * TAU, r = 52;
  G.particles.push({ x: LANES[1].x + Math.cos(a) * r, y: LANES[1].y - 60 + Math.sin(a) * r, vx: Math.cos(a) * 40, vy: -40 - Math.random() * 60, life: 0.5, t: 0, r: 5 + Math.random() * 4, rot: 0, color: '#fff7b0', star: true, four: true });
}
function throwRose() {
  G.score += 500;
  popup('+500 BONUS', 395, 680, '#ff6fae');
  const tx = 395 + (Math.random() - 0.5) * 120, ty = 760 + Math.random() * 40;
  G.roses.push({ x0: -30, y0: 420, x1: tx, y1: ty, t: 0, dur: 0.75, rot: (Math.random() - 0.5) * 0.9 });
}

/* ---------------- input ---------------- */
function toLogical(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
function nearestLane(x, y) {
  let best = 0, bd = 1e9;
  LANES.forEach((L, i) => { const d = Math.hypot(L.x - x, L.y - y) - (i === 2 ? 30 : 0); if (d < bd) { bd = d; best = i; } });
  return best;
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (G.state !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const p = toLogical(e), lane = nearestLane(p.x, p.y);
  const rec = { x: p.x, y: p.y, used: false, lane };
  G.pointers.set(e.pointerId, rec);
  const t = songNow();
  // a tap note waiting on that drum wins; otherwise, if a swipe is due, wait to see if this becomes a swipe
  const tapWaiting = G.notes.some((n) => !n.done && !n.headDone && n.lane === lane && Math.abs(n.t - t) <= WIN.GOOD);
  if (tapWaiting || !pendingSwipe(t)) { hitLane(lane, 'p' + e.pointerId); rec.used = 'tap'; }
});
cv.addEventListener('pointermove', (e) => {
  const rec = G.pointers.get(e.pointerId);
  if (!rec || rec.used === 'swipe') return;
  const p = toLogical(e);
  if (Math.hypot(p.x - rec.x, p.y - rec.y) >= 45) {
    if (rec.used === 'tap' && G.notes.some((n) => n.holding && n.holder === 'p' + e.pointerId)) return; // keep holding
    rec.used = 'swipe';
    doSwipe();
  }
});
function endPointer(e) {
  const rec = G.pointers.get(e.pointerId);
  if (!rec) return;
  G.pointers.delete(e.pointerId);
  releaseHold('p' + e.pointerId);
  if (!rec.used && G.state === 'play') hitLane(rec.lane, 'p' + e.pointerId); // a short tap that never became a swipe
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); if (G.state === 'play') pauseGame(); else if (G.state === 'paused') resumeGame(); return; }
  if (G.state !== 'play' || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'd') hitLane(0, 'kd');
  else if (k === 'k') hitLane(2, 'kk');
  else if (k === ' ' || e.code === 'Space') { e.preventDefault(); G.keyHold = true; hitLane(1, 'key'); }
  else if (k === 'l') doSwipe();
});
window.addEventListener('keyup', (e) => {
  if ((e.key === ' ' || e.code === 'Space') && G.keyHold) { G.keyHold = null; releaseHold('key'); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('blur', () => pauseGame());

/* ---------------- UI wiring ---------------- */
function show(id) {
  ['menu', 'pause', 'result'].forEach((p) => document.getElementById(p).classList.toggle('hidden', p !== id));
}
function refreshMenu() {
  document.querySelectorAll('.diff').forEach((b) => {
    const d = b.dataset.diff;
    b.classList.toggle('on', d === G.diff);
    b.querySelector('small').textContent = 'BEST ' + Math.round(G.best[d]).toLocaleString();
  });
}
document.querySelectorAll('.diff').forEach((b) => b.addEventListener('click', () => { G.diff = b.dataset.diff; refreshMenu(); }));
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
  const a = b.dataset.act;
  if (a === 'resume') resumeGame();
  else if (a === 'restart' || a === 'retry') startGame();
  else if (a === 'menu') toMenu();
}));

function drawIcons() {
  document.querySelectorAll('canvas[data-icon]').forEach((c) => {
    const g = c.getContext('2d'), k = c.width / 66;
    g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, 66, 66);
    const kind = c.dataset.icon;
    if (kind === 'snare') drawCard(g, 33, 33, 40, 0);
    else if (kind === 'kick') drawCard(g, 33, 33, 40, 2);
    else if (kind === 'hold') {
      drawHoldBar(g, 33, 50, 10, 1, false);
      ell(g, 33, 50, 14, 14); paint(g, '#fff7b0', 3);
    } else drawSwipeIcon(g, 33, 36, 0.48);
  });
}

/* ---------------- main loop: update + draw ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state === 'play') {
    syncClock();
    if (G.autoplay) autoplay();
    updateJudging();
    const heard = G.startAt + songNow();
    while (G.vEvents.length && G.vEvents[0].t <= heard) {
      const ev = G.vEvents.shift();
      if (ev.kind === 'brass') G.puff = 1;
      else if (ev.kind === 'lead') G.leadUntil = Math.max(G.leadUntil, ev.t - G.startAt + ev.dur);
      else if (ev.kind === 'hat') G.fx.hat = 1;
    }
    if (songNow() > SONG_LEN + 1.0 && !G.ended) finish();
  }
  if (G.state !== 'paused') {
    G.missTimer = Math.max(0, G.missTimer - dt);
    G.fx.shake = G.fx.shake.map((s) => Math.max(0, s - dt * 4));
    G.fx.hat = Math.max(0, G.fx.hat - dt * 8);
    G.puff = Math.max(0, G.puff - dt * 3.2);
    G.comboPop = Math.max(0, G.comboPop - dt * 6);
    G.particles = G.particles.filter((p) => (p.t += dt) < p.life);
    G.particles.forEach((p) => { if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.rot += dt * 8; } });
    G.popups = G.popups.filter((p) => (p.t += dt) < 0.7);
    G.roses = G.roses.filter((r) => {
      r.t += dt;
      if (r.t >= r.dur) { G.fx.stuckRoses.push({ x: r.x1, y: r.y1, rot: r.rot }); if (G.fx.stuckRoses.length > 10) G.fx.stuckRoses.shift(); return false; }
      return true;
    });
  }
  draw(now / 1000);
  requestAnimationFrame(frame);
}

function draw(clock) {
  const c = ctx;
  c.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
  if (bgCache) c.drawImage(bgCache, 0, 0, W, H); else { c.fillStyle = '#1a1530'; c.fillRect(0, 0, W, H); }
  const inGame = G.state === 'play' || G.state === 'paused' || G.state === 'result';
  const t = inGame ? songNow() : clock;           // menu: free-running stage at the same tempo
  const beatPos = Math.max(0, t) / BEAT, phase = beatPos % 1;
  const missOn = G.missTimer > 0;

  // colored rig beams
  c.save(); c.globalCompositeOperation = 'lighter';
  const beamCols = ['255,111,174', '255,210,63', '92,200,255'];
  [[30, 1], [W - 30, -1]].forEach(([x0, dir], side) => {
    for (let i = 0; i < 3; i++) {
      const sx = x0 + dir * (12 + i * 60), sway = Math.sin(t * 1.3 + i + side) * 60;
      const on = (Math.floor(beatPos) + i + side) % 3 === 0 ? 0.16 : 0.07;
      const g = c.createLinearGradient(sx, 100, sx, 620);
      g.addColorStop(0, `rgba(${beamCols[i]},${missOn ? on * 0.3 : on})`); g.addColorStop(1, `rgba(${beamCols[i]},0)`);
      c.fillStyle = g;
      c.beginPath(); c.moveTo(sx - 10, 110); c.lineTo(sx + 10, 110); c.lineTo(270 + sway + dir * 40 + 70, 620); c.lineTo(270 + sway + dir * 40 - 70, 620); c.fill();
    }
  });
  c.restore();

  // spotlight
  if (!missOn) {
    c.save(); c.globalCompositeOperation = 'lighter';
    const g = c.createLinearGradient(0, 0, 0, 620);
    g.addColorStop(0, 'rgba(255,240,190,.32)'); g.addColorStop(1, 'rgba(255,240,190,.10)');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(225, 0); c.lineTo(315, 0); c.lineTo(400, 606); c.lineTo(140, 606); c.closePath(); c.fill();
    ell(c, 270, 604, 135, 26); c.fillStyle = 'rgba(255,240,190,.28)'; c.fill();
    c.restore();
  } else {
    c.fillStyle = 'rgba(8,4,20,.35)'; c.fillRect(0, 0, W, 682);
  }

  // band
  const sec = sectionOf(Math.floor(Math.max(0, t) / BAR));
  const singing = inGame && t < G.leadUntil;
  const verseMouth = inGame && sec === 'verse' ? Math.max(0, 1 - phase * 2.2) * 0.55 : 0;
  const menuMouth = !inGame ? Math.max(0, Math.sin(t * 5)) * 0.5 : 0;
  const mouth = Math.max(singing ? 0.75 + Math.sin(t * 22) * 0.25 : 0, verseMouth, menuMouth);
  const up = Math.sin(phase * Math.PI);
  drawFrog(c, 112, 602, { bounce: up, puff: inGame ? Math.max(G.puff, 0) : Math.max(0, Math.sin(t * 4)) * 0.6, t });
  drawCat(c, 270, 604, { bounce: up, squash: Math.pow(1 - phase, 4), wave: Math.sin(beatPos * Math.PI), mouth, gray: missOn, t });

  // drum kit
  drawKit(c, clock, G.fx);

  if (inGame) drawPlayfield(c, t, clock, beatPos);
  else { // gentle idle hits on the menu stage
    if (phase < 0.03 && Math.floor(beatPos) % 2 === 0) G.fx.shake[2] = 0.6;
  }

  // flying roses
  G.roses.forEach((r) => {
    const p = r.t / r.dur, x = r.x0 + (r.x1 - r.x0) * p, y = r.y0 + (r.y1 - r.y0) * p - Math.sin(p * Math.PI) * 220;
    drawRose(c, x, y, r.rot + (1 - p) * 8, 1.2 - p * 0.2);
  });
  // particles
  G.particles.forEach((p) => {
    const k = p.t / p.life;
    c.save(); c.globalAlpha = 1 - k;
    if (p.ring) { ell(c, p.x, p.y, 30 + k * 90, (30 + k * 90) * 0.5); c.strokeStyle = p.color; c.lineWidth = 8 * (1 - k); c.stroke(); }
    else { starPath(c, p.x, p.y, p.r * (1 - k * 0.4), p.rot, p.four ? 4 : 5); paint(c, p.color, p.four ? 0 : 2.5); }
    c.restore();
  });
  // judgement popups
  G.popups.forEach((p) => {
    const k = p.t / 0.7, s = p.t < 0.1 ? 0.6 + p.t * 4 : 1;
    c.save(); c.globalAlpha = Math.min(1, 1.6 - k * 1.6); c.translate(p.x, p.y - k * 50); c.scale(s, s);
    text(c, p.text, 0, 0, p.text.length > 7 ? 36 : 44, p.color);
    c.restore();
  });

  if (inGame) drawHUD(c, t);
}

function drawPlayfield(c, t, clock, beatPos) {
  const fall = DIFFS[G.diff].fall;
  // lane guide during the first two bars
  if (t < BAR * 2) {
    const a = t < 0 ? 1 : Math.min(1, (BAR * 2 - t) / 0.6);
    c.save(); c.globalAlpha = a;
    LANES.forEach((L) => {
      const g = c.createLinearGradient(0, SPAWN_Y, 0, L.y);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, L.color);
      c.globalAlpha = a * 0.35; c.fillStyle = g; rrect(c, L.x - 38, SPAWN_Y, 76, L.y - SPAWN_Y, 30); c.fill();
      c.globalAlpha = a; c.setLineDash([10, 10]); rrect(c, L.x - 38, SPAWN_Y, 76, L.y - SPAWN_Y, 30); c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 3; c.stroke(); c.setLineDash([]);
    });
    c.fillStyle = 'rgba(29,36,82,.75)'; rrect(c, 40, 200, 460, 112, 30); c.fill();
    text(c, '음악에 맞춰 드럼을 두드리세요', 270, 240, 34, '#fff4e0');
    text(c, 'play the drum to the beat', 270, 282, 26, '#ffd23f');
    c.restore();
  }
  // target rings pulsing on the beat
  const pulse = 1 + Math.pow(1 - (Math.max(0, beatPos) % 1), 3) * 0.12;
  [0, 2].forEach((i) => {
    const L = LANES[i];
    c.save(); c.translate(L.x, L.y); c.scale(pulse, pulse);
    rrect(c, -37, -37, 74, 74, 18); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 4; c.setLineDash([12, 8]); c.stroke(); c.setLineDash([]);
    c.restore();
  });
  const yAt = (nt, L) => L.y - (nt - t) / fall * (L.y - SPAWN_Y);

  for (const n of G.notes) {
    if (n.t - t > fall + 0.05) break;
    if (n.type === 'tap') {
      if (n.done) continue;
      const L = LANES[n.lane];
      const y = yAt(n.t, L);
      if (y < SPAWN_Y - 40) continue;
      const late = t > n.t ? Math.min(1, (t - n.t) / WIN.GOOD) : 0;
      drawCard(c, L.x, Math.min(y, L.y + 30), 64, n.lane, 1 - late * 0.5);
    } else if (n.type === 'hold') {
      if (n.done && !n.holding) continue;
      const L = LANES[1];
      const head = n.headDone ? L.y : yAt(n.t, L);
      const tail = Math.max(SPAWN_Y, yAt(n.end, L));
      if (head < SPAWN_Y - 40) continue;
      drawHoldBar(c, L.x, Math.min(head, L.y), Math.min(tail, L.y), 1, n.holding);
      // HOLD target circle above the cymbal with an approaching ring
      const toHead = n.t - t, cx = L.x, cy = L.y - 60;
      c.save();
      if (!n.headDone && toHead > -WIN.GOOD) {
        const k = Math.max(0, Math.min(1, toHead / fall));
        ell(c, cx, cy, 42 + k * 70, 42 + k * 70); c.strokeStyle = 'rgba(255,210,63,' + (0.4 + (1 - k) * 0.6) + ')'; c.lineWidth = 6; c.stroke();
      }
      ell(c, cx, cy, 40, 40); paint(c, n.holding ? '#fff08a' : 'rgba(255,210,63,.9)', 5);
      if (n.holding) {
        const prog = Math.max(0, Math.min(1, (t - n.t) / (n.end - n.t)));
        c.beginPath(); c.arc(cx, cy, 52, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
        c.strokeStyle = OUT; c.lineWidth = 14; c.lineCap = 'round'; c.stroke();
        c.strokeStyle = '#ffd23f'; c.lineWidth = 8; c.stroke();
      }
      text(c, 'HOLD', cx, cy + 2, 24, OUT, { lw: 0 });
      c.restore();
    } else if (n.type === 'swipe') {
      const toHit = n.t - t;
      let alpha = 1;
      if (n.done) { const since = t - (n.hitAt !== undefined ? n.hitAt : n.t); if (since > 0.4) continue; alpha = 1 - since / 0.4; }
      if (toHit > fall) continue;
      const p = Math.max(0, Math.min(1, 1 - toHit / fall));
      c.save(); c.globalAlpha = alpha;
      c.lineCap = 'round';
      c.beginPath();
      for (let i = 0; i <= 24; i++) { const [x, y] = swipeCurve(i / 24); i ? c.lineTo(x, y) : c.moveTo(x, y); }
      const ok = n.done && n.grade !== 'MISS', bad = n.done && n.grade === 'MISS';
      c.strokeStyle = OUT; c.lineWidth = 46; c.stroke();
      c.strokeStyle = bad ? '#b9b2c9' : ok ? '#b8ffcf' : '#5ee08a'; c.lineWidth = 34; c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 8; c.setLineDash([16, 18]); c.lineDashOffset = -clock * 80; c.stroke(); c.setLineDash([]);
      const [ax, ay] = swipeCurve(1);
      c.beginPath(); c.moveTo(ax - 6, ay - 34); c.lineTo(ax + 34, ay + 4); c.lineTo(ax - 10, ay + 30); c.closePath(); paint(c, bad ? '#b9b2c9' : '#5ee08a', 5);
      text(c, 'SWIPE →', 270, SWIPE_Y - 150, 40, '#5ee08a');
      if (!n.done) { const [bx, by] = swipeCurve(p); ell(c, bx, by, 20, 20); paint(c, '#fff', 5); }
      c.restore();
    }
  }
}

function drawHUD(c, t) {
  text(c, 'SCORE', 24, 34, 22, '#ffd23f', { align: 'left' });
  text(c, Math.round(G.score).toLocaleString(), 24, 68, 38, '#fff', { align: 'left' });
  if (G.combo >= 3) {
    const s = 1 + G.comboPop * 0.25;
    c.save(); c.translate(306, 52); c.scale(s, s);
    text(c, String(G.combo), 0, 0, 52, '#fff');
    c.restore();
    text(c, 'COMBO  x' + multiplier().toFixed(1), 306, 90, 20, '#ff6fae');
  }
  // progress bar
  const p = Math.max(0, Math.min(1, t / SONG_LEN));
  rrect(c, 24, 938, 492, 14, 7); paint(c, 'rgba(255,255,255,.18)', 3);
  if (p > 0) { rrect(c, 24, 938, Math.max(14, 492 * p), 14, 7); c.fillStyle = '#7fe0c4'; c.fill(); }
  ell(c, 24 + 492 * p, 945, 11, 11); paint(c, '#ffd23f', 4);
}

/* ---------------- boot ---------------- */
loadBest();
layout();
refreshMenu();
drawIcons();
show('menu');
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  document.fonts.load('40px Jua').then(() => { bgCache = buildBackground(pxRatio); drawIcons(); }).catch(() => {});
}
// test hooks (no effect on play)
window.__nyang = { G, buildChart, LANES, start: (d) => { G.diff = d || G.diff; startGame(); } };
</script>
</body>
</html>
